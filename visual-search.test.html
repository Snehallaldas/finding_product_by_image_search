<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visual search unit tests</title>
    <style>
      body { margin: 2rem auto; max-width: 760px; padding: 0 1rem; color: #20231f; font: 15px/1.6 "Segoe UI", sans-serif; }
      .pass { color: #315d34; } .fail { color: #9a3025; }
      li { margin: .4rem 0; }
    </style>
    <script type="module">
      import { normalizeEmbedding, rankProducts, retrievalMetrics, similarity } from "./visual-search.js?object-aware=1";
      import { selectFootwearDetections } from "./image-embeddings.js?object-aware=1";

      const results = document.querySelector("#results");
      const tests = [];
      function test(name, run) {
        try {
          run();
          tests.push({ name, passed: true });
        } catch (error) {
          tests.push({ name, passed: false, error: error.message });
          console.error(error);
        }
      }
      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }
      const first = normalizeEmbedding([3, 4, 0]);
      const same = normalizeEmbedding([6, 8, 0]);
      const orthogonal = normalizeEmbedding([0, 0, 1]);
      const globalFeature = normalizeEmbedding([1, 0, 0]);
      const cropFeature = normalizeEmbedding([0, 1, 0]);
      const composedQuery = { version: 3, vectors: [globalFeature, cropFeature], objectVectors: [cropFeature] };
      const sameItemDifferentComposition = { version: 2, vectors: [orthogonal, cropFeature] };
      const differentItem = { version: 2, vectors: [globalFeature, orthogonal] };

      test("embeddings are normalized and finite", () => {
        assert(Math.abs(Math.hypot(...first) - 1) < 0.0001, "Embedding should have unit length.");
      });
      test("equivalent embeddings have cosine similarity 1", () => {
        assert(Math.abs(similarity(first, same) - 1) < 0.0001, "Equivalent vectors should match exactly.");
      });
      test("unrelated orthogonal embeddings have lower similarity", () => {
        assert(similarity(first, orthogonal) < similarity(first, same), "Orthogonal embeddings should rank lower.");
      });
      test("ranking sorts by similarity and respects category filter", () => {
        const ranked = rankProducts(first, [
          { name: "Different sandal", category: "sandals", embedding: orthogonal },
          { name: "Similar shoe", category: "shoes", embedding: same },
        ], "shoes");
        assert(ranked.length === 1 && ranked[0].name === "Similar shoe", "Expected only the best shoes result.");
      });
      test("retrieval metrics reward relevant matches near the top", () => {
        const metrics = retrievalMetrics(["shoe-a", "other", "shoe-b"], ["shoe-a", "shoe-b"], 3);
        assert(Math.abs(metrics.recallAtK - 1) < 0.0001, "Recall@K should count both relevant products.");
        assert(Math.abs(metrics.averagePrecisionAtK - (5 / 6)) < 0.0001, "AP@K should reward the earlier relevant result.");
      });
      test("retrieval metrics report misses against all labeled positives", () => {
        const metrics = retrievalMetrics(["other", "shoe-a", "other-2"], ["shoe-a", "shoe-b"], 3);
        assert(Math.abs(metrics.recallAtK - 0.5) < 0.0001, "Recall@K should include relevant products missing from the result.");
        assert(Math.abs(metrics.averagePrecisionAtK - 0.25) < 0.0001, "AP@K should use the labeled positive count as its denominator.");
      });
      test("retrieval metrics reject empty ground truth and invalid cutoffs", () => {
        let emptyRejected = false;
        let cutoffRejected = false;
        try {
          retrievalMetrics(["shoe-a"], [], 1);
        } catch (error) {
          emptyRejected = error instanceof TypeError;
        }
        try {
          retrievalMetrics(["shoe-a"], ["shoe-a"], 0);
        } catch (error) {
          cutoffRejected = error instanceof RangeError;
        }
        assert(emptyRejected && cutoffRejected, "Invalid benchmark labels and cutoffs should be rejected.");
      });
      test("invalid and zero-length embeddings are rejected", () => {
        let rejected = false;
        try {
          normalizeEmbedding([0, 0]);
        } catch (error) {
          rejected = error instanceof TypeError;
        }
        assert(rejected, "Zero-length embeddings should throw TypeError.");
      });
      test("embeddings with different dimensions cannot be compared", () => {
        let rejected = false;
        try {
          similarity(first, new Float32Array([1, 0]));
        } catch (error) {
          rejected = error instanceof TypeError;
        }
        assert(rejected, "Mismatched dimensions should throw TypeError.");
      });
      test("matching image crops can rank above mismatched whole-image composition", () => {
        const ranked = rankProducts(composedQuery, [
          { name: "Different shoe", category: "shoes", embedding: differentItem },
          { name: "Same shoe, different composition", category: "shoes", embedding: sameItemDifferentComposition },
        ]);
        assert(ranked[0].name === "Same shoe, different composition", "Matching crops should outweigh a composition change.");
      });
      test("legacy single-vector catalog embeddings remain searchable", () => {
        const ranked = rankProducts(first, [
          { name: "Legacy match", category: "shoes", embedding: same },
        ]);
        assert(ranked[0].name === "Legacy match" && Math.abs(ranked[0].score - 1) < 0.0001, "Legacy vectors should remain searchable.");
      });
      test("detected footwear crops take priority over composition-sensitive whole-image scores", () => {
        const objectMatch = { version: 3, vectors: [orthogonal], objectVectors: [cropFeature] };
        const objectMismatch = { version: 3, vectors: [globalFeature], objectVectors: [orthogonal] };
        const ranked = rankProducts(composedQuery, [
          { name: "Different footwear", category: "sandals", embedding: objectMismatch },
          { name: "Same footwear, different composition", category: "sandals", embedding: objectMatch },
        ]);
        assert(ranked[0].name === "Same footwear, different composition", "Matching detected-object crops should rank first.");
        assert(Math.abs(ranked[0].score - 1) < 0.0001, "The detected-object score should use the crop-to-crop cosine.");
      });
      test("missing detected crops retain crop-aware matching", () => {
        const noDetection = { version: 3, vectors: [orthogonal, cropFeature], objectVectors: [] };
        assert(similarity(composedQuery, noDetection) > similarity(composedQuery, differentItem), "Images without detections should use the existing crop score.");
      });
      test("footwear detection filters overlapping boxes and limits crop count", () => {
        const selected = selectFootwearDetections([
          { score: 0.4, box: { xmin: 0, ymin: 0, xmax: 100, ymax: 100 } },
          { score: 0.3, box: { xmin: 2, ymin: 2, xmax: 98, ymax: 98 } },
          { score: 0.2, box: { xmin: 120, ymin: 10, xmax: 180, ymax: 80 } },
          { score: 0.05, box: { xmin: 200, ymin: 0, xmax: 240, ymax: 50 } },
        ]);
        assert(selected.length === 2, "Expected two non-overlapping detections above the threshold.");
        assert(selected[0].score === 0.4 && selected[1].score === 0.2, "Expected detections ranked by score with duplicate boxes removed.");
      });
      test("version 3 embeddings reject missing detected-object vectors", () => {
        let rejected = false;
        try {
          similarity({ version: 3, vectors: [first] }, { version: 3, vectors: [same], objectVectors: [] });
        } catch (error) {
          rejected = error instanceof TypeError;
        }
        assert(rejected, "Malformed object-aware embeddings should not silently use generic crops.");
      });

      results.replaceChildren(...tests.map((result) => {
        const item = document.createElement("li");
        item.className = result.passed ? "pass" : "fail";
        item.textContent = `${result.passed ? "PASS" : "FAIL"} — ${result.name}${result.error ? `: ${result.error}` : ""}`;
        return item;
      }));
      const summary = document.querySelector("#summary");
      const failures = tests.filter((result) => !result.passed).length;
      summary.textContent = `${tests.length - failures}/${tests.length} tests passed`;
      summary.className = failures ? "fail" : "pass";
      document.title = failures ? "FAIL — Visual search tests" : "PASS — Visual search tests";
    </script>
  </head>
  <body>
    <h1>Visual search tests</h1>
    <p id="summary">Running…</p>
    <ol id="results"></ol>
  </body>
</html>
